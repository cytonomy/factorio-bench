name: Repository quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$package"
          # SHA-256 published on the upstream v8.30.1 release.
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $package" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/factorio-bench-tools"
          tar -xzf "$package" -C "$RUNNER_TEMP/factorio-bench-tools" gitleaks
          echo "$RUNNER_TEMP/factorio-bench-tools" >> "$GITHUB_PATH"

      - name: Check publication safety
        run: make check-secrets

      - name: Check documentation and repository rules
        run: make check
